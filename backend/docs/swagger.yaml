            additionalProperties: true
            type: object
        "404":
          description: Профиль кандидата не найден
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Этот FSP ID уже привязан к другому аккаунту
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 'Подключить аккаунт ФСП (mock: возвращает достижения)'
      tags:
      - FSP
  /api/fsp/disconnect:
    post:
      responses:
